services:
  db:
    image: postgres:16-alpine
    container_name: satark_db_dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-satark_db}
      POSTGRES_USER: ${POSTGRES_USER:-satark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satark_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satark_user} -d ${POSTGRES_DB:-satark_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: satark_redis_dev
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: satark_api_dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-satark_user}:${POSTGRES_PASSWORD:-satark_password}@db:5432/${POSTGRES_DB:-satark_db}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-satark_user}:${POSTGRES_PASSWORD:-satark_password}@db:5432/${POSTGRES_DB:-satark_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: satark_web_dev
    command: npm run dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/messages:/app/messages
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data_dev:
